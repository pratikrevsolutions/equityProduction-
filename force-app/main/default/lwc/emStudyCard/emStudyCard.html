<template>
    <div class="study-card">
        <div class="study-name">{name}</div>
        <div class="field-strip">
            <div class="field">
                <div class="field-label">Onboarding Status</div>
                <div class="field-value">{onboardingStatus}</div>
            </div>
            <div class="field">
                <div class="field-label">Onboarding Step</div>
                <div class="field-value">{onboardingStep}</div>
            </div>
            <div class="field">
                <div class="field-label">Onboarding Progress</div>
                <div class="field-value">{progressLabel}</div>
            </div>
            <div class="field">
                <div class="field-label">Program Sponsor</div>
                <div class="field-value">{sponsor}</div>
            </div>
            <div class="field">
                <div class="field-label">Protocol Number</div>
                <div class="field-value">{protocol}</div>
            </div>
            <div class="field">
                <div class="field-label">Target Activation Date</div>
                <div class="field-value">{targetDate}</div>
            </div>
        </div>
    </div>
</template>
