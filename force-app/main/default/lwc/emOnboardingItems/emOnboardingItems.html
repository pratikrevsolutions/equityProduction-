<template>
    <div class="panel">
        <div class="panel-head">
            <div class="panel-title">
                <lightning-icon icon-name="standard:task" size="small" class="slds-m-right_x-small"></lightning-icon>
                <span>{title}</span>
                <span class="muted">{summary.reqDone} of {summary.req} required done · {summary.pctLabel}</span>
            </div>
            <div class="filters">
                <template for:each={filterOptions} for:item="f">
                    <lightning-button key={f.value} variant={f.variant} label={f.label} data-value={f.value} onclick={handleFilter} class="filter-btn"></lightning-button>
                </template>
            </div>
        </div>

        <template lwc:if={errorText}><div class="slds-text-color_error slds-m-vertical_small">{errorText}</div></template>

        <template lwc:if={hasItems}>
            <template lwc:if={upNext}>
                <div class="up-next">
                    <div class="up-next-label">Up next</div>
                    <div class="up-next-main">
                        <a href={upNext.url} class="up-next-subject">{upNext.subject}</a>
                        <div class="up-next-meta">
                            <span class="pill">{upNext.workstream}</span>
                            <template lwc:if={upNext.site}><span class="pill site">{upNext.site}</span></template>
                            <span class={upNext.dueClass}>Due {upNext.dueLabel}</span>
                            <template lwc:if={upNext.owner}><span class="owner">· {upNext.owner}</span></template>
                        </div>
                    </div>
                    <lightning-button variant="success" label="Complete" icon-name="utility:check" data-id={upNext.id}
                        onclick={handleComplete} disabled={upNext.isBusy}></lightning-button>
                </div>
            </template>

            <template for:each={groups} for:item="g">
                <div key={g.name} class="group">
                    <div class={g.headerClass} data-ws={g.name} onclick={handleToggleGroup}>
                        <lightning-icon icon-name={g.chevron} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        <span class="group-name">{g.name}</span>
                        <span class="group-count">{g.count}</span>
                        <span class="group-status">{g.statusLine}</span>
                        <template lwc:if={g.complete}><lightning-icon icon-name="utility:success" size="x-small" class="group-check"></lightning-icon></template>
                    </div>
                    <template lwc:if={g.expanded}>
                        <ul class="rows">
                            <template for:each={g.openRows} for:item="r">
                                <li key={r.id} class={r.rowClass}>
                                    <template lwc:if={r.blocked}>
                                        <span class="tick locked" title={r.blockedLabel}><lightning-icon icon-name="utility:lock" size="xx-small" alternative-text="Blocked"></lightning-icon></span>
                                    </template>
                                    <template lwc:else>
                                        <button class="tick" title="Mark complete" data-id={r.id} onclick={handleComplete} disabled={r.isBusy}>
                                            <lightning-icon icon-name="utility:check" size="xx-small" alternative-text="Complete"></lightning-icon>
                                        </button>
                                    </template>
                                    <div class="row-main">
                                        <a href={r.url} class="subject">{r.subject}</a>
                                        <template lwc:if={r.required}><span class="req">Required</span></template>
                                        <template lwc:if={r.step}><span class="pill step" title="Proves this onboarding step">{r.step}</span></template>
                                        <template lwc:if={r.site}><span class="pill site">{r.site}</span></template>
                                        <template lwc:if={r.sourceLabel}><span class="pill exc">{r.sourceLabel}</span></template>
                                        <template lwc:if={r.blocked}><span class="pill locked">{r.blockedLabel}</span></template>
                                        <template lwc:if={r.hint}><div class="hint">{r.hint}</div></template>
                                    </div>
                                    <div class="row-side">
                                        <span class={r.dueClass}>{r.dueLabel}</span>
                                        <span class="owner">{r.owner}</span>
                                    </div>
                                </li>
                            </template>
                            <template lwc:if={g.emptyOpen}><li class="item is-empty">No open items match the filter.</li></template>
                            <template lwc:if={g.hasDone}>
                                <li class="done-toggle"><button class="link" data-ws={g.name} onclick={handleToggleDone}>{g.doneToggleLabel}</button></li>
                            </template>
                            <template for:each={g.doneRows} for:item="r">
                                <li key={r.id} class={r.rowClass}>
                                    <span class="tick done"><lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" alternative-text="Done"></lightning-icon></span>
                                    <div class="row-main">
                                        <a href={r.url} class="subject">{r.subject}</a>
                                        <template lwc:if={r.site}><span class="pill site">{r.site}</span></template>
                                        <span class="pill done-pill">{r.sourceLabel}</span>
                                    </div>
                                    <div class="row-side"><span class="due">{r.dueLabel}</span><span class="owner">{r.owner}</span></div>
                                </li>
                            </template>
                        </ul>
                    </template>
                </div>
            </template>
        </template>

        <template lwc:if={showEmpty}>
            <div class="empty">No onboarding items on this study yet — use <b>Start Onboarding</b> once the study is awarded. Items are generated from the onboarding template for every workstream, plus per-site items on each Care Program Site.</div>
        </template>
    </div>
</template>
